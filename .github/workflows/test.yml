name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Zero npm dependencies by design — there is nothing to install.
      - name: Assert the dependency-free invariant
        run: |
          node -e '
            const p = require("./package.json");
            for (const k of ["dependencies", "devDependencies"]) {
              const n = Object.keys(p[k] || {}).length;
              if (n) { console.error(`package.json has ${n} ${k}; this project is deliberately dependency-free`); process.exit(1); }
            }
            console.log("ok  zero dependencies");
          '
      - name: Assert the repo ships no live-mode switch
        run: |
          node -e '
            const fs = require("fs");
            const env = fs.readFileSync(".env.example", "utf8");
            const bad = [/^\s*MODE\s*=\s*live/mi, /^\s*DEMO\s*=\s*1/mi, /^\s*LIVE_CONFIRM\s*=\s*\S/mi];
            for (const re of bad) {
              if (re.test(env)) { console.error(`.env.example arms live/demo mode: ${re}`); process.exit(1); }
            }
            console.log("ok  .env.example is safe by default");
          '
      # The suite is hermetic: no network, no wall clock.
      - run: npm test

  # Every push to main that passes the suite goes straight to the Fly desk, so the live dashboard is
  # never a deploy behind the repo. The rails before anything ships:
  #   - it waits for BOTH test jobs, so a red build never reaches the box;
  #   - only the newest main deploys. Deploys queue one at a time, but not in push order: two merges
  #     seconds apart can finish their tests in either order, and the older commit's deploy would
  #     then land last and roll the box back. A run whose commit is no longer main's head stands
  #     down; the newer push's own run deploys;
  #   - a push that changes nothing the box runs (most ops notes) is skipped -- a redeploy restarts
  #     the desk, and a restart for nothing is not worth it. README.md and ops/DEPLOY.md DO count:
  #     the image carries them for the Ask panel's docs tool, which would otherwise quote the old
  #     copy until the next code push. "Changes" is measured
  #     against the `fly-deployed` tag (the commit the box last got), not this push's parent, so a
  #     code push that stood down or was cancelled while queued still ships with the next push;
  #   - fly.toml must still say MODE = "paper". This pipeline must never be the thing that arms
  #     real money; going live stays a deliberate, manual act.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to move the fly-deployed tag after a successful deploy
    concurrency:
      group: fly-deploy
      cancel-in-progress: false   # never kill a deploy halfway; the next one queues behind it
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Runs inside the fly-deploy lock, so no other deploy can land between this check and ours.
      - name: Stand down unless this is still the newest main
        id: newest
        run: |
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          head="$(git rev-parse origin/main)"
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "newest=false" >> "$GITHUB_OUTPUT"
            echo "main has moved on to $head; that push's run deploys it, so not deploying ${{ github.sha }}"
          fi
      - name: Skip pushes that change nothing the box runs
        id: changed
        if: steps.newest.outputs.newest == 'true'
        run: |
          git fetch --quiet --force origin +refs/tags/fly-deployed:refs/tags/fly-deployed 2>/dev/null || true
          deployed="$(git rev-parse -q --verify 'refs/tags/fly-deployed^{commit}' || true)"
          if [ -z "$deployed" ]; then
            echo "ship=true" >> "$GITHUB_OUTPUT"; echo "no fly-deployed tag yet; deploying"; exit 0
          fi
          if git diff --name-only "$deployed" "${{ github.sha }}" | grep -qE '^(src|public|tools)/|^server\.js$|^Dockerfile$|^fly\.toml$|^package(-lock)?\.json$|^README\.md$|^ops/DEPLOY\.md$'; then
            echo "ship=true" >> "$GITHUB_OUTPUT"
          else
            echo "ship=false" >> "$GITHUB_OUTPUT"; echo "no runtime files changed since $deployed; not redeploying"
          fi
      - name: Refuse to deploy anything but a paper desk
        if: steps.changed.outputs.ship == 'true'
        run: |
          grep -qE '^\s*MODE\s*=\s*"paper"' fly.toml || { echo 'fly.toml is not MODE = "paper"; refusing to auto-deploy'; exit 1; }
          if grep -qE '^\s*(LIVE_CONFIRM|DEMO)\s*=' fly.toml; then echo 'fly.toml sets LIVE_CONFIRM or DEMO; refusing to auto-deploy'; exit 1; fi
          echo "ok  paper desk"
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.changed.outputs.ship == 'true'
      - name: Deploy to Fly
        if: steps.changed.outputs.ship == 'true'
        run: flyctl deploy --remote-only -a hexagon-desk --build-arg GIT_SHA="${{ github.sha }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Only reached if the deploy succeeded. If this push fails, the tag stays behind and the next
      # run just sees more changes and ships -- the safe direction.
      - name: Record what the box now runs
        if: steps.changed.outputs.ship == 'true'
        run: git push --force origin "${{ github.sha }}:refs/tags/fly-deployed"
