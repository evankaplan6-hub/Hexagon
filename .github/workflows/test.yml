name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Zero npm dependencies by design — there is nothing to install.
      - name: Assert the dependency-free invariant
        run: |
          node -e '
            const p = require("./package.json");
            for (const k of ["dependencies", "devDependencies"]) {
              const n = Object.keys(p[k] || {}).length;
              if (n) { console.error(`package.json has ${n} ${k}; this project is deliberately dependency-free`); process.exit(1); }
            }
            console.log("ok  zero dependencies");
          '
      - name: Assert the repo ships no live-mode switch
        run: |
          node -e '
            const fs = require("fs");
            const env = fs.readFileSync(".env.example", "utf8");
            const bad = [/^\s*MODE\s*=\s*live/mi, /^\s*DEMO\s*=\s*1/mi, /^\s*LIVE_CONFIRM\s*=\s*\S/mi];
            for (const re of bad) {
              if (re.test(env)) { console.error(`.env.example arms live/demo mode: ${re}`); process.exit(1); }
            }
            console.log("ok  .env.example is safe by default");
          '
      # The suite is hermetic: no network, no wall clock.
      - run: npm test

  # Every push to main that passes the suite goes straight to the Fly desk, so the live dashboard is
  # never a deploy behind the repo. Three rails before anything ships:
  #   - it waits for BOTH test jobs, so a red build never reaches the box;
  #   - a push that touches only docs or ops notes is skipped -- a redeploy restarts the desk, and
  #     a restart for a README edit is a restart for nothing;
  #   - fly.toml must still say MODE = "paper". This pipeline must never be the thing that arms
  #     real money; going live stays a deliberate, manual act.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy
      cancel-in-progress: false   # never kill a deploy halfway; the next one queues behind it
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip pushes that change nothing the box runs
        id: changed
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "ship=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" | grep -qE '^(src|public|tools)/|^server\.js$|^Dockerfile$|^fly\.toml$|^package(-lock)?\.json$'; then
            echo "ship=true" >> "$GITHUB_OUTPUT"
          else
            echo "ship=false" >> "$GITHUB_OUTPUT"; echo "no runtime files changed; not redeploying"
          fi
      - name: Refuse to deploy anything but a paper desk
        if: steps.changed.outputs.ship == 'true'
        run: |
          grep -qE '^\s*MODE\s*=\s*"paper"' fly.toml || { echo 'fly.toml is not MODE = "paper"; refusing to auto-deploy'; exit 1; }
          if grep -qE '^\s*(LIVE_CONFIRM|DEMO)\s*=' fly.toml; then echo 'fly.toml sets LIVE_CONFIRM or DEMO; refusing to auto-deploy'; exit 1; fi
          echo "ok  paper desk"
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.changed.outputs.ship == 'true'
      - name: Deploy to Fly
        if: steps.changed.outputs.ship == 'true'
        run: flyctl deploy --remote-only -a hexagon-desk
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
