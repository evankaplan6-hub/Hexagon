# Fly.io deployment. Chosen over the alternatives for three reasons that matter here: it has US
# regions (Kalshi's API is US-facing and a European box is a needless risk), it gives a persistent
# volume on the cheap tier so the journals survive a restart, and a machine can idle without being
# killed — a market maker that gets suspended between requests is not a market maker.
app = "hexagon-desk"
primary_region = "iad"          # Ashburn, Virginia — close to the exchange, and US-domiciled

[build]
  dockerfile = "Dockerfile"

[env]
  MODE = "paper"                # DASH_PASS is set as a secret, never here
  BIND_HOST = "0.0.0.0"
  PORT = "8787"
  DATA_DIR = "/data"
  # Phase 1 of ops/rework-plan-2026-09-12.md shipped as 1a (tape pagination) and 1b (reduce in
  # the tails) only. The toxicity gate (1c) and the soft cap (1d) replayed with no effect on
  # run-over contracts, the number they exist to cut, so both were switched off here: a run-over
  # bar of 1 never trips, a soft cap of 1 is the hard cap. The soft cap is still off.
  # The toxicity gate came back on 2026-09-15, counted in contracts with a four-hour rest: re-scored
  # on five days of tape it was the setting better in every period and queue tried (src/config.js).
  MAKER_MAX_RUNOVER = "0.40"
  MAKER_TOX_BY_CONTRACTS = "1"
  MAKER_TOX_COOLDOWN_MIN = "240"
  MAKER_SOFT_CAP = "1"
  # Only RIGO's mind is on here (2026-09-18). It can close a convergence position early and nothing
  # else, and the hard exits run before it is asked. ILSA's mind can originate trades and stays off:
  # BRAIN_AGENTS is what keeps it off, so do not widen it without a reason. With no
  # ANTHROPIC_API_KEY on the box none of this does anything; with one, RIGO spends at most
  # BRAIN_DAILY_USD a day, and Ask and Research keep their own caps (ASK_DAILY_USD, RESEARCH_DAILY_USD).
  BRAIN = "1"
  BRAIN_AGENTS = "RIGO"
  BRAIN_DAILY_USD = "1"
  # Raised back to src/config.js's own default on 2026-09-17: the half-size cap set on 2026-09-13
  # was meant to hold until "a day of tape and memory says it can take more," and four days in the
  # box was dropping 223 already-matched, already-rules-verified pairs a cycle for it -- more pairs
  # thrown away than kept. Free memory measured ~245 MB of 512 MB at the time. Watch memory after
  # this deploy; if the box gets tight, the number to pull back down is this one.
  ANY_MAX_PAIRS = "300"
  # Raised from src/config.js's 300 on 2026-09-20, the first Sunday the desk could see the NFL.
  # The fast path's Polymarket side is the top N markets by 24h volume, and a football Sunday
  # floods that ranking with ONE game's own derivatives: Polymarket lists ~328 markets per NFL
  # game (spreads, totals, quarters, props), so Commanders v Cowboys pushed its own moneyline --
  # the only leg Kalshi has a counterpart for -- out of the top 300 while four of its spread and
  # total markets stayed in. 13 of the day's 14 games paired; that one did not. 500 restores it
  # and takes today's moneylines from 27 to 36. The pages are fetched in parallel, so this costs
  # two more Gamma requests a cycle and ~170 more market objects, against the 31,840 the
  # any-market crawl already holds. If the box gets tight, ANY_MAX_PAIRS above is still the
  # number to pull down first -- this one is small.
  PM_UNIVERSE = "500"
  # Raised from the 3% default (src/config.js) on 2026-09-17: the desk hit 3% intraday and TESS
  # correctly halted new risk, but 3% of a $10k paper account is $300 -- tight enough that one bad
  # day parks the desk for the rest of it. Widened by request; it is still paper money.
  MAX_DAILY_DRAWDOWN_PCT = "0.05"
  # Both raised 2026-09-17, same request: the long-dated budget (src/config.js MAX_LONG_ARB_GROUPS)
  # was full at 3/3 and turning away a real arb (Game Awards Best Audio Design), and the main arb
  # book (MAX_ARB_GROUPS) was one slot from doing the same at 11/12. Paper capital, not real money
  # tied up -- widened to give the book more room before the next one binds.
  MAX_LONG_ARB_GROUPS = "6"
  MAX_ARB_GROUPS = "20"

# The stall watchdog (src/watchdog.js, WATCHDOG_SEC) ends the process when the desk's loops stop
# finishing rounds, and this is what brings it back. Fly's default is on-failure with ten retries,
# which would leave the box dead after the tenth stall; "always" has no such count.
[[restart]]
  policy = "always"

# The ledger, the journals and the tick tape. Without this a redeploy silently resets the evidence.
[[mounts]]
  source = "hexagon_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # The desk must keep running between page views. auto_stop would suspend the machine when nobody
  # is looking at the dashboard, which is exactly when it should be quoting.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"              # the tick recorder and journals are the only real consumers
