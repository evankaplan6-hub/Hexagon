# Fly.io deployment. Chosen over the alternatives for three reasons that matter here: it has US
# regions (Kalshi's API is US-facing and a European box is a needless risk), it gives a persistent
# volume on the cheap tier so the journals survive a restart, and a machine can idle without being
# killed — a market maker that gets suspended between requests is not a market maker.
app = "hexagon-desk"
primary_region = "iad"          # Ashburn, Virginia — close to the exchange, and US-domiciled

[build]
  dockerfile = "Dockerfile"

[env]
  MODE = "paper"                # DASH_PASS is set as a secret, never here
  BIND_HOST = "0.0.0.0"
  PORT = "8787"
  DATA_DIR = "/data"
  # Phase 1 of ops/rework-plan-2026-09-12.md shipped as 1a (tape pagination) and 1b (reduce in
  # the tails) only. The toxicity gate (1c) and the soft cap (1d) replayed with no effect on
  # run-over contracts, the number they exist to cut, so both were switched off here: a run-over
  # bar of 1 never trips, a soft cap of 1 is the hard cap. The soft cap is still off.
  # The toxicity gate came back on 2026-09-15, counted in contracts with a four-hour rest: re-scored
  # on five days of tape it was the setting better in every period and queue tried (src/config.js).
  MAKER_MAX_RUNOVER = "0.40"
  MAKER_TOX_BY_CONTRACTS = "1"
  MAKER_TOX_COOLDOWN_MIN = "240"
  MAKER_SOFT_CAP = "1"
  # The crawl-widened universe was where the maker's money went: on four days of tape (2026-09-19 →
  # 09-22) its fills marked -0.66c to -1.82c a contract 30 minutes on, against -0.34c to -0.64c on
  # the listed series, and it was two thirds of the contracts (tools/maker-slice.js). Off since
  # 2026-09-23: the listed series are the book, and the fair rail (MAKER_FAIR_RAIL, src/config.js)
  # keeps their paired markets on Polymarket's side of the price.
  MAKER_WIDEN = "0"
  # Only RIGO's mind is on here (2026-09-18). It can close a convergence position early and nothing
  # else, and the hard exits run before it is asked. ILSA's mind can originate trades and stays off:
  # BRAIN_AGENTS is what keeps it off, so do not widen it without a reason. With no
  # ANTHROPIC_API_KEY on the box none of this does anything; with one, RIGO spends at most
  # BRAIN_DAILY_USD a day, and Ask and Research keep their own caps (ASK_DAILY_USD, RESEARCH_DAILY_USD).
  BRAIN = "1"
  BRAIN_AGENTS = "RIGO"
  BRAIN_DAILY_USD = "1"
  # Raised back to src/config.js's own default on 2026-09-17: the half-size cap set on 2026-09-13
  # was meant to hold until "a day of tape and memory says it can take more," and four days in the
  # box was dropping 223 already-matched, already-rules-verified pairs a cycle for it -- more pairs
  # thrown away than kept. Free memory measured ~245 MB of 512 MB at the time. Watch memory after
  # this deploy; if the box gets tight, the number to pull back down is this one.
  ANY_MAX_PAIRS = "300"
  # Raised from src/config.js's 300 on 2026-09-20, the first Sunday the desk could see the NFL.
  # The fast path's Polymarket side is the top N markets by 24h volume, and a football Sunday
  # floods that ranking with ONE game's own derivatives: Polymarket lists ~328 markets per NFL
  # game (spreads, totals, quarters, props), so Commanders v Cowboys pushed its own moneyline --
  # the only leg Kalshi has a counterpart for -- out of the top 300 while four of its spread and
  # total markets stayed in. 13 of the day's 14 games paired; that one did not. 500 restores it
  # and takes today's moneylines from 27 to 36. The pages are fetched in parallel, so this costs
  # two more Gamma requests a cycle and ~170 more market objects, against the 31,840 the
  # any-market crawl already holds. If the box gets tight, ANY_MAX_PAIRS above is still the
  # number to pull down first -- this one is small.
  PM_UNIVERSE = "500"
  # Raised from src/config.js's 20 on 2026-09-20, because the crawl had grown into the gap between
  # crawls. One any-market scan now takes 474-541s, and at DISCOVER_EVERY_MIN=20 that is ~42% of
  # every window spent crawling. The box is one shared vCPU: /proc/pressure/cpu read
  # "some avg60=59.05 avg300=44.50" -- tasks waiting on CPU about half the time -- against
  # /proc/pressure/memory flat 0.00, so this is CPU, not the 512 MB. Starved that hard, timers stop
  # firing: getJSON aborts at 15s, yet the stall watchdog caught calls stuck in `fetch` for
  # 292-1513s, and it restarted the desk 18 times on 2026-09-20. The cost is the crawl's own HTTP
  # and JSON volume, not the matching -- src/match-any.js benchmarks at ~175ms over a full
  # 22.5k x 9.7k crawl, so making it yield would fix nothing. The crawl also roughly doubled that
  # day (22,524 -> 42,573 Kalshi markets) when #82 dropped its volume floor. 45 min puts the duty
  # cycle near 19%. These pairs are Oscars 2027 and September unemployment; they do not move in 20
  # minutes, and src/anymarket.js restores the last crawl's pairs across a restart. The starvation
  # itself turned out to be Fly's CPU cap, not the crawl: see [[vm]] below (2026-09-22).
  # 90 since 2026-09-22, once the steady polls were trimmed (#109-#111) and the crawl was the
  # biggest read left: ~272 MB of Kalshi events and ~60 MB of Polymarket events a crawl, about a
  # third of every byte the desk read at 45 minutes. Each crawl cannot be made much smaller: 68% of
  # the Kalshi bytes are markets the keep filter drops, but most sit inside events that also hold
  # markets it keeps, and Kalshi filters /events by nothing that tracks volume. Skipping events that
  # kept nothing last time would save at most ~25% of the Kalshi half, for a two-step crawl. So it
  # runs half as often: a new election, award or season market is paired up to 90 minutes after it
  # lists.
  DISCOVER_EVERY_MIN = "90"
  # Raised from the 3% default (src/config.js) on 2026-09-17: the desk hit 3% intraday and TESS
  # correctly halted new risk, but 3% of a $10k paper account is $300 -- tight enough that one bad
  # day parks the desk for the rest of it. Widened by request; it is still paper money.
  MAX_DAILY_DRAWDOWN_PCT = "0.05"
  # Both raised 2026-09-17, same request: the long-dated budget (src/config.js MAX_LONG_ARB_GROUPS)
  # was full at 3/3 and turning away a real arb (Game Awards Best Audio Design), and the main arb
  # book (MAX_ARB_GROUPS) was one slot from doing the same at 11/12. Paper capital, not real money
  # tied up -- widened to give the book more room before the next one binds.
  MAX_LONG_ARB_GROUPS = "6"
  MAX_ARB_GROUPS = "20"
  # The convergence book is off on the box since 2026-09-21. The verdict from the journals,
  # 2026-09-10 to 09-21: 72 convergence bets closed, 3 winners, -$637 (-$293 of it fees), and the
  # gates added on the 18th and 19th only slowed the bleeding (-$10, -$61, -$10 a day). Open
  # positions are still marked and taken to their exits; the locked-arb book and the maker keep
  # trading; every pair is still priced and written to the tape, so the book can be re-scored
  # from the tape without paying for another week of it. Set to "1" to turn it back on.
  CONVERGE = "0"
  # The option-chain recorder runs inside the desk here (src/chainsched.js) since 2026-09-23: the
  # box has no cron, so its Stocks and Options tabs had read an empty folder since they shipped.
  # Same tool, same three Eastern times as the Mac's launchd job, weekdays only, as a child
  # process. This copy is for the tabs, not the archive: the volume is 1 GB and a day of chains is
  # up to ~5 MB, so only the newest CHAINS_KEEP_DAYS days are kept. The Mac's tape keeps every day.
  CHAINS = "1"
  CHAINS_KEEP_DAYS = "14"

# The stall watchdog (src/watchdog.js, WATCHDOG_SEC) ends the process when the desk's loops stop
# finishing rounds, and this is what brings it back. Fly's default is on-failure with ten retries,
# which would leave the box dead after the tenth stall; "always" has no such count.
[[restart]]
  policy = "always"

# The ledger, the journals and the tick tape. Without this a redeploy silently resets the evidence.
[[mounts]]
  source = "hexagon_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # The desk must keep running between page views. auto_stop would suspend the machine when nobody
  # is looking at the dashboard, which is exactly when it should be quoting.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

# shared-cpu-2x since 2026-09-22. Fly caps a shared vCPU at 5ms of CPU per 80ms -- 6.25% of a core --
# and lets it run faster only on credit saved while idle (fly.io/docs/machines/cpu-performance). On
# shared-cpu-1x the desk wanted a little more than that all day, so it never saved any: a 60s sample
# of /proc/stat read the desk at ~7.6% and "steal" (Fly holding it back) at ~50%, and the PSI
# "some ~58%" above is that throttling, not demand. The loops still finished 3.2-3.7 of 4 taker
# cycles a minute, so the desk was only modestly over the cap, and any extra work (a crawl, a burst
# of fills) pushed a loop past the 300s watchdog: 5 restarts on 2026-09-22. The crawl is not the
# steady load -- a local run with this env spent 36 MB/min of JSON with no crawl in it, 40% of it
# the Gamma top-500 listing every 15s and 25% the maker's trade poll every 2s. 2x doubles the cap
# to 12.5% for about $0.72 a month more. That Gamma listing is read every 120s since #109 (and
# Kalshi's fast listing since #111); steal read 0% on 2026-09-24. If the box is held back again, look
# there before turning off WHALE_WATCH or RECORD_MAKER (~5% between them).
[[vm]]
  size = "shared-cpu-2x"
  memory = "512mb"              # the tick recorder and journals are the only real consumers
