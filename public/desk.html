<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the page reach round an iPhone's notch; desk.css pads by the safe areas -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- Safari tints its bars in the page's own colour (tokens.css --bg-0), light or dark -->
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<!-- added to a Home Screen or the Dock, it opens as an app of its own, with no browser around it -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hexagon">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- a figure is not a phone number -->
<meta name="format-detection" content="telephone=no">
<title>The Hexagon</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- the system's own font (San Francisco on Apple's devices): nothing to load -->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="desk.css">
</head>
<body>
<!-- the bar across the top: the name, the desk's light, the market, the time -->
<header class="top" id="top">
  <div class="bar">
    <div class="brand">
      <span class="appicon" aria-hidden="true">
        <svg viewBox="0 0 40 40">
          <polygon points="20,3 35,11.5 35,28.5 20,37 5,28.5 5,11.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>
          <polygon points="20,10 29,15 29,25 20,30 11,25 11,15" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" opacity=".7"/>
          <polygon class="core" points="20,15.5 24.5,18 24.5,22 20,24.5 15.5,22 15.5,18"/>
        </svg>
      </span>
      <h1>The Hexagon</h1>
    </div>
    <!-- the one thing a glance is asking: is the desk working, and with whose money -->
    <div class="pill" id="deskstate" title="Paper only: no broker is connected to this desk, and it has no way to place a real order"></div>
    <!-- the stock market's hours and how fresh each price is -->
    <span class="mkt" id="mkt"></span>
    <span class="clock" id="clock"></span>
  </div>
</header>

<!-- One screen, nothing to scroll (2026-10-02, Evan: "It should all be able to fit on one page, not having to
     scroll down or up"): each desk's figure with every one of its books as a tile, the P&L chart, and the latest
     trades. Whatever is behind a tile (a book's holdings, the desk's numbers, every line of the activity) opens
     over the page in a sheet, and Done or the back button closes it. -->
<p class="banner" id="banner" role="status" hidden></p>
<main id="floor" class="board" aria-busy="true">
  <section class="card tile" id="ovdesk" aria-label="Stocks, crypto and options"></section>
  <section class="card tile" id="ovpm" aria-label="Prediction markets" hidden></section>
  <section class="card chartcard" aria-label="Profit and loss"><div id="chart" class="pnl"></div></section>
  <section class="card latest" aria-label="Latest">
    <div class="cardhead"><h2 class="label">Latest</h2><a class="seeall" href="#activity">All activity</a></div>
    <ol class="feed" id="latestlist"><li class="empty">Waiting for the first desk round.</li></ol>
  </section>
</main>

<!-- what is behind a tile, over the page: a book's card, a desk's numbers, or the whole activity list. Opened by a
     link (#book/crypto, #book/pm-arbs, #desk, #pm, #activity), so the back button closes it. -->
<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheettitle">
  <div class="sbox">
    <div class="sh"><h2 id="sheettitle"></h2><button type="button" class="sdone" data-close="1">Done</button></div>
    <div class="sbody">
      <div id="sheetdetail"></div>
      <!-- everything the desks did, newest first, filtered by how much of it to show and which desk -->
      <div id="sheetactivity" class="act" hidden>
        <div class="filters">
          <div class="seg" id="fshow" role="group" aria-label="Show"></div>
          <div class="seg" id="fdesk" role="group" aria-label="Desk"></div>
        </div>
        <ol class="feed" id="feedlist"><li class="empty">Waiting for the first desk round.</li></ol>
      </div>
    </div>
  </div>
</div>

<!-- the P&L chart opened large: a sheet, with Done where iOS puts it -->
<div id="chartbig" hidden role="dialog" aria-modal="true" aria-label="Profit and loss chart">
  <div class="cbbox">
    <!-- the chart's one title in here (the chart leaves its own out); a phone keeps the first half -->
    <div class="cbh"><span>Profit and loss<span class="more"> · stocks, crypto and options, and what just holding would have made</span></span><button type="button" class="cbback" data-close="1">Done</button></div>
    <div id="chartbig-pnl" class="pnl big"></div>
  </div>
</div>
<!-- read out when a fill lands or the desk stops, and nothing else -->
<span class="sr" id="announce" role="status"></span>
<!-- TradingView Lightweight Charts, vendored: see vendor/README.md -->
<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script src="desk.js"></script>
</body>
</html>
